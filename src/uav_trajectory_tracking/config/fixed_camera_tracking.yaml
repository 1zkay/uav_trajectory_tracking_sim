fixed_camera_target_tracker:
  ros__parameters:
    # Intrinsics come exclusively from the actual camera's CameraInfo.
    target_class_id: ""
    target_track_id: ""
    min_score: 0.2
    observation_timeout_s: 0.2
    # For a rigid camera, lock means a continuously observed track, not
    # a centered/stabilized gimbal. Off-axis observations remain usable.
    lock_confirm_s: 0.2
