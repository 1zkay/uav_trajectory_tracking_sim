# Shared observation lifetime for the observer and visual guidance nodes.
/**:
  ros__parameters:
    observation_timeout_s: 0.2

fixed_camera_target_tracker:
  ros__parameters:
    # Intrinsics come exclusively from the actual camera's CameraInfo.
    target_class_id: ""
    min_score: 0.2
    # Single-target scene: accept valid observations regardless of track ID.
    # For a rigid camera, lock means continuous observations, not
    # a centered/stabilized gimbal. Off-axis observations remain usable.
    lock_confirm_s: 0.2
